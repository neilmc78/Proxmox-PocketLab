name: Android CI

# Every PR and every push to main: unit tests + the "dev" build: the release build (R8) under its
# own app ID (dev.pocketlab.dev, shown as "Pocketlab Dev"), so it installs next to the real app.
# Its version is the release the PR will become plus the run number, e.g. 0.3.4-dev.17.
# Signed with the release key when the signing secrets are available, so each dev build updates the
# last one. Dependabot PRs get no secrets: their APKs are signed with a throwaway debug key and must
# replace an installed dev build by uninstalling it first. Real releases come from release.yml.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0   # release tags, to work out the next version

      # Read-only: the version this PR becomes when merged ([minor]/[major] in its title count).
      - name: Work out the dev version
        id: next
        uses: neilmc78/release-on-merge@v1
        with:
          dry-run: true
          title: ${{ github.event.pull_request.title }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      # cache-provider: basic = the MIT-licensed cache. v6's default ("enhanced") is proprietary and
      # using it means accepting Gradle's Terms of Use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Write signing config (if secrets are available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets: dev APKs will be debug-signed."; exit 0; fi
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Dev build (R8, installs as "Pocketlab Dev")
        run: >
          ./gradlew --no-daemon assembleDev
          -PappVersionName=${{ steps.next.outputs.version }}
          -PappVersionSuffix=-dev.${{ github.run_number }}

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      # The app blocks screenshots (FLAG_SECURE), so these test renders are how a PR's UI gets reviewed.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: app/build/screens/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: pocketlab-dev-${{ github.run_number }}
          path: app/build/outputs/apk/dev/*.apk
          retention-days: 14

  # Puts the PR's UI screenshots on the `screenshots` branch (pr-<N>/) and shows them in a PR comment,
  # so they can be viewed inline (neilmc78/release-on-merge/pr-screenshots). This is the only job that
  # can write, and it never checks out or runs the PR's code: it only copies the PNGs the build job
  # uploaded. Skipped for Dependabot and forks.
  screenshots:
    needs: build
    if: >
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: screenshots-branch   # one writer at a time; it force-pushes the whole branch
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true   # no artifact if the build failed before the tests ran
        with:
          name: screenshots-${{ github.run_number }}
          path: shots

      - name: Publish to the screenshots branch and comment on the PR
        uses: neilmc78/release-on-merge/pr-screenshots@v1
        with:
          path: shots
