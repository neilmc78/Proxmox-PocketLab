name: Android CI

# Every PR and every push to main: unit tests + the "dev" build: the release build (R8) under its
# own app ID (dev.pocketlab.dev, shown as "Pocketlab Dev"), so it installs next to the real app.
# Signed with the release key when the signing secrets are available, so each dev build updates the
# last one. Dependabot PRs get no secrets: their APKs are signed with a throwaway debug key and must
# replace an installed dev build by uninstalling it first. Real releases come from release.yml.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      # cache-provider: basic = the MIT-licensed cache. v6's default ("enhanced") is proprietary and
      # using it means accepting Gradle's Terms of Use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Write signing config (if secrets are available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets: dev APKs will be debug-signed."; exit 0; fi
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Dev build (R8, installs as "Pocketlab Dev")
        run: ./gradlew --no-daemon assembleDev -PappVersionName=ci.${{ github.run_number }}

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: pocketlab-dev-${{ github.run_number }}
          path: app/build/outputs/apk/dev/*.apk
          retention-days: 14
