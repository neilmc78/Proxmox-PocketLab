name: Android CI

# Every PR and every push to main: unit tests + a shrunk (R8) release build.
# The APKs it uploads are signed with the runner's throwaway debug key: fine for trying a PR,
# but they won't update over a real release install. Real releases come from release.yml.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      # cache-provider: basic = the MIT-licensed cache. v6's default ("enhanced") is proprietary and
      # using it means accepting Gradle's Terms of Use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release build (R8, debug-signed)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: pocketlab-ci-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
