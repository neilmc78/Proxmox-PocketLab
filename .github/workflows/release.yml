name: Release

# Every merge to main is released by neilmc78/release-on-merge: the next patch version by default,
# or the next minor or major one when the PR's title says [minor] or [major]. The signed APKs are
# built from that release's tag and attached to it. Run this workflow by hand to release main
# without a merge. Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   base64 of your release .jks
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges are released one after the other, never with one version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag and create the release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        uses: neilmc78/release-on-merge@v1

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Parse version from tag
        id: ver
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $TAG)"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then echo "::error::minor/patch must be < 1000"; exit 1; fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-disabled: true   # release builds start clean

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          umask 077
          {
            echo "storeFile=$ks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build signed APKs
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PrequireReleaseSigning
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Verify signature and collect APKs
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            certs=$("$apksigner" verify --print-certs "$f")
            echo "$certs"
            if grep -q "CN=Android Debug" <<<"$certs"; then echo "::error::$f is debug-signed"; exit 1; fi
            cp "$f" "dist/pocketlab-${{ steps.ver.outputs.name }}-$(basename "$f" | sed 's/^app-//; s/-release//')"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # release-on-merge has already created the release, so the APKs are attached to it.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Pocketlab $TAG" --generate-notes --verify-tag
          fi
